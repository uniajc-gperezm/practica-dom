<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <h1 class="header__title">To-Do List</h1>
    </header>
    <main class="main">
        <section class="todo-app">
            <form class="todo-form" id="todo-form">
                <input type="text" class="todo-form__input" id="todo-title" placeholder="Nueva tarea" required>
                <input type="date" class="todo-form__input" id="date-picker" required>
                <button type="submit" class="todo-form__button">Añadir Tarea</button>
            </form>
            <ul class="todo-list" id="todo-list">
                <!-- Las tareas se añadirán aquí dinámicamente -->
            </ul>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
